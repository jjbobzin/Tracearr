packages:
  - "apps/*"
  - "packages/*"
overrides:
  # react-native-css 3.0.7 visitors only work against lightningcss ~1.30.1
  # (1.30.2 and >=1.32 both break its serde contract); scoped so tailwind's
  # own exact lightningcss pin stays current.
  '@expo/metro-config>lightningcss': 1.30.1
  hono: '>=4.12.34'
  '@hono/node-server': '>=2.0.10'
  fast-jwt: '>=6.2.2'
  express-rate-limit: '>=8.2.2'
  flatted: '>=3.4.0'
  node-forge: '>=1.4.0'
  yaml: '>=2.8.3'
  picomatch@>=4: '>=4.0.4'
  picomatch@<4: '>=2.3.2'
  brace-expansion@>=2: '>=5.0.7'
  brace-expansion@<2: '>=1.1.13'
  path-to-regexp@>=8: '>=8.4.0'
  rollup@>=4: '>=4.59.0'
  socket.io-parser: '>=4.2.7'
  lodash: '>=4.17.23'
  bn.js@<5: '>=4.12.3'
  minimatch@<4: '>=3.1.3'
  js-yaml@>=4: '^4.3.1'
  nanoid@<4: '^3.3.17'
  '@esbuild-kit/core-utils>esbuild': '^0.25.0'
publicHoistPattern:
  - '@babel/types'
allowBuilds:
  '@shopify/react-native-skia': true
  esbuild: true
  react-native-nitro-modules: true
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  bcrypt: false
  core-js-pure: false
  msgpackr-extract: false
  msw: false
  sharp: false
  tree-sitter: false
  tree-sitter-json: false
  vue-demi: false
minimumReleaseAgeExclude:
  - '@fastify/swagger@9.8.1'
  - '@turbo/darwin-64@2.10.5'
  - '@turbo/darwin-arm64@2.10.5'
  - '@turbo/linux-64@2.10.5'
  - '@turbo/linux-arm64@2.10.5'
  - '@turbo/windows-64@2.10.5'
  - '@turbo/windows-arm64@2.10.5'
  - turbo@2.10.5
  - '@expo/cli@57.0.12'
  - '@expo/router-server@57.0.5'
  - expo-constants@57.0.9
  - expo-modules-core@57.0.9
  - expo@57.0.10
  - '@expo/ui@57.0.9'
  - expo-image@57.0.2
  - expo-linking@57.0.5
  - expo-router@57.0.10
  - expo-updates@57.0.12
