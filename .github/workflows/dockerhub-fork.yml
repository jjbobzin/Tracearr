name: Publish Fork Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - local-map-coordinates

env:
  IMAGE_NAME: tracearr

jobs:
  dockerhub-supervised:
    name: Build and push supervised image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get build metadata
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push supervised image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.supervised
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:local-map-coordinates
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:supervised
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:local-map-coordinates-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=1.5.0
            APP_TAG=supervised-v1.5.0-local-map
            APP_COMMIT=${{ steps.meta.outputs.short_sha }}
            APP_BUILD_DATE=${{ steps.meta.outputs.build_date }}
            CACHE_BUST=${{ github.sha }}
